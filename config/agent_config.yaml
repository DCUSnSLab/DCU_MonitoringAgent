# DCU Monitoring Agent Configuration
# ===================================

agent:
  id: ""                        # auto-generate
  lab_name: "lab1"
  version: "1.0.30"

monitoring:
  interval_seconds: 1
  track_foreground: true

  input_activity:
    enabled: true
    output_dir: "data/input_activity"

  process:
    mode: "all"
    whitelist:
      - "chrome.exe"
      - "code.exe"
      - "devenv.exe"
      - "notepad.exe"
      - "explorer.exe"
    blacklist:
      - "kakaotalk.exe"
      - "telegram.exe"
      - "discord.exe"
    always_blocked:                  # 모드와 무관하게 항상 차단으로 탐지 (AI 데스크톱 앱)
      - "claude.exe"
      - "chatgpt.exe"
      - "chatgpt classic.exe"

  chrome:
    enabled: true
    debug_port: 9222
    poll_interval_seconds: 5
    user_data_dir: "C:\\chrome-debug"
    blocked_urls:
      - "chat.openai.com"
      - "chatgpt.com"
      - "bard.google.com"
      - "gemini.google.com"
      - "claude.ai"

  messenger:
    enabled: true
    process_names:
      - "kakaotalk.exe"
      - "telegram.exe"
      - "discord.exe"
    url_patterns:
      - "instagram.com"
      - "facebook.com"
      - "messenger.com"
      - "web.whatsapp.com"
      - "web.telegram.org"
      - "discord.com"

  # 주소창 URL 읽기 (CDP 없이 크롬 계열 브라우저의 주소창을 읽어 blocked_urls·url_patterns 로 탐지)
  address_bar:
    enabled: true
    browser_processes:
      - "chrome.exe"
      - "msedge.exe"
      - "whale.exe"

  # 창 제목 기반 탐지 (주소창을 읽지 못한 브라우저 창을 창 제목으로 탐지, 대소문자 무시·부분일치)
  window_title:
    enabled: true
    browser_processes:
      - "chrome.exe"
      - "msedge.exe"
      - "whale.exe"
      - "firefox.exe"
    messenger_keywords:
      - "Instagram"
      - "Facebook"
      - "Messenger"
      - "WhatsApp"
      - "Telegram"
      - "Discord"
    blocked_keywords:
      - "ChatGPT"
      - "Gemini"
      - "Claude"

server:
  enabled: true
  base_url: "http://203.250.35.27:30085"
  api_key: "dcu-secret-key-change-in-production"
  use_websocket: false
  ws_url: "ws://203.250.35.27:30085/ws"
  retry_interval_seconds: 30
  offline_buffer_size: 1000

security:
  prevent_exit: true
  exit_password: "admin1234"
  hide_from_taskbar: false

logging:
  level: "INFO"
  file: "logs/agent.log"
  max_size_mb: 10
  backup_count: 5
  console_output: true
