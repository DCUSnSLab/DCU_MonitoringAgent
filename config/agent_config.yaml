# DCU Monitoring Agent Configuration
# ===================================

agent:
  id: ""                        # auto-generate
  lab_name: "lab1"
  version: "1.0.17"

monitoring:
  interval_seconds: 1
  track_foreground: true

  process:
    mode: "all"
    whitelist:
      - "chrome.exe"
      - "code.exe"
      - "devenv.exe"
      - "notepad.exe"
      - "explorer.exe"
    blacklist:
      - "kakaotalk.exe"
      - "telegram.exe"
      - "discord.exe"

  chrome:
    enabled: true
    debug_port: 9222
    poll_interval_seconds: 5
    user_data_dir: "C:\\chrome-debug"
    blocked_urls:
      - "chat.openai.com"
      - "chatgpt.com"
      - "bard.google.com"
      - "gemini.google.com"

server:
  enabled: true
  base_url: "http://203.250.35.27:30085"
  api_key: "dcu-secret-key-change-in-production"
  use_websocket: false
  ws_url: "ws://203.250.35.27:30085/ws"
  retry_interval_seconds: 30
  offline_buffer_size: 1000

security:
  prevent_exit: true
  exit_password: "admin1234"
  hide_from_taskbar: false

logging:
  level: "INFO"
  file: "logs/agent.log"
  max_size_mb: 10
  backup_count: 5
  console_output: true
