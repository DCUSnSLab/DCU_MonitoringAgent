services:

  # ─── PostgreSQL 데이터베이스 ────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: dcu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcu
      POSTGRES_PASSWORD: dcu1234
      POSTGRES_DB: dcu_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcu -d dcu_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI 백엔드 ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dcu_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dcu:dcu1234@db:5432/dcu_monitoring
      API_KEY: dcu-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app   # 개발 시 hot-reload
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ─── Next.js 프론트엔드 ─────────────────────────────────────────
  frontend:
    build:
      context: ./dcu-dashboard
      dockerfile: Dockerfile
    container_name: dcu_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
