services:

  # ─── PostgreSQL 데이터베이스 ────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: dcu_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dcu
      POSTGRES_PASSWORD: dcu1234
      POSTGRES_DB: dcu_monitoring
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dcu -d dcu_monitoring"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── FastAPI 백엔드 ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dcu_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://dcu:dcu1234@db:5432/dcu_monitoring
      API_KEY: dcu-secret-key-change-in-production
      CORS_ORIGINS: '["http://localhost:3000","http://frontend:3000"]'
      OTA_FILES_DIR: /app/ota_files
      # 대시보드 관리자 로그인: server/.env 의 값을 전달 (비밀번호가 비어 있으면 로그인 불가)
      DASHBOARD_ADMIN_USERNAME: ${DASHBOARD_ADMIN_USERNAME:-admin}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD:-}
      DASHBOARD_TOKEN_SECRET: ${DASHBOARD_TOKEN_SECRET:-}
      DASHBOARD_AUTH_MODE: ${DASHBOARD_AUTH_MODE:-local}
      DASHBOARD_FRONTEND_URL: ${DASHBOARD_FRONTEND_URL:-http://localhost:3000}
      DASHBOARD_COOKIE_SECURE: ${DASHBOARD_COOKIE_SECURE:-false}
      SSO_ISSUER: ${SSO_ISSUER:-https://code.cu.ac.kr/sso}
      SSO_INTERNAL_BASE: ${SSO_INTERNAL_BASE:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-agent-monitoring}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      SSO_REDIRECT_URI: ${SSO_REDIRECT_URI:-http://localhost:8000/api/auth/callback}
      SSO_TOKEN_ENCRYPTION_KEY: ${SSO_TOKEN_ENCRYPTION_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app   # 개발 시 hot-reload
      - ota_files:/app/ota_files  # OTA 업데이트 파일 영속 저장
    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      --reload

  # ─── Next.js 프론트엔드 ─────────────────────────────────────────
  frontend:
    build:
      context: ./dcu-dashboard
      dockerfile: Dockerfile
    container_name: dcu_frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
      HOSTNAME: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  ota_files:
